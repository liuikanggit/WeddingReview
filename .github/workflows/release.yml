name: 打包发布

# 打 tag（v0.1.0 这种）时自动发版；也可以在 Actions 页面手动触发试跑。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 打通用包，Intel 和 Apple Silicon 都能装
          - platform: macos-latest
            target: universal-apple-darwin
            label: macOS
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    # secrets 上下文在步骤的 if 里用不了（GitHub 会直接拒绝解析整个工作流），
    # 但 job 级 env 可以读 secrets，步骤的 if 又能读 env——绕一道即可。
    # 这里只落"配没配"的布尔值，不把密钥本身摊到 env 里。
    env:
      HAS_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Rust 编译是这里最慢的一步，按平台+目标分开缓存
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # 公证用的 API Key 必须以「磁盘上的文件」形式提供：
      # APPLE_API_KEY_PATH 是路径，不是密钥内容本身。
      # Secrets 只能存文本，所以存 base64，用之前还原成 .p8 文件。
      - name: 还原公证 API Key
        if: matrix.platform == 'macos-latest' && env.HAS_NOTARY_KEY == 'true'
        env:
          P8: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$P8" | base64 --decode > ~/private_keys/AuthKey.p8
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── macOS 签名与公证（可选）─────────────────────────
          # 仓库里配了下面这些 secrets 就走正式签名 + 公证，装完双击即开、零提示；
          # 没配就沿用 tauri.conf.json 里的 ad-hoc 签名，对方首次打开需要右键。
          # 两种情况都能出包，不会因为缺 secrets 而失败。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # APPLE_API_KEY_PATH 由上面的「还原公证 API Key」步骤写进 GITHUB_ENV，
          # 这里不要再显式赋值，否则会被空值覆盖掉。
        with:
          args: --target ${{ matrix.target }}
          # 只有推 tag 时才发 release；手动触发（workflow_dispatch）时留空，
          # 否则会拿分支名当版本号，建出一个叫「main」的 release 来。
          # 留空时 tauri-action 只构建、不发布，正好用来验证能不能编过。
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 拾光笺 ${{ github.ref_name }}
          releaseBody: |
            按系统选择安装包：

            - **macOS**：`.dmg`（通用包，Intel 与 Apple Silicon 都可用）
            - **Windows**：`.exe` 安装程序

            > 转发给别人时，macOS 请发 `.dmg` 本身，不要发 `拾光笺.app`——
            > `.app` 是文件夹，经微信/QQ 转发会损坏，打开会报「已损坏」。

            如果安装包未经 Apple 公证，首次打开时：
            - macOS：Control + 点击图标 →「打开」，只需一次
            - Windows：SmartScreen 提示时选「更多信息」→「仍要运行」
          releaseDraft: true
          prerelease: false

      # 手动试跑不发 release，产物就没地方取了。传成 workflow artifact，
      # 好在正式发版前先下下来装一遍、确认签名和公证真的生效。
      - name: 上传试跑产物
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: 拾光笺-${{ matrix.label }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      # 签名/公证一旦悄悄失效，包照样能出，只是别人打不开——
      # 在 CI 里当场验一遍，不合格就让这次构建红掉。
      - name: 校验签名与公证
        if: matrix.platform == 'macos-latest' && env.HAS_SIGNING == 'true'
        run: |
          APP=$(find src-tauri/target -name "*.app" -maxdepth 5 -type d | head -1)
          echo "检查 $APP"
          codesign -dvvv "$APP" 2>&1 | grep -E "Authority|Signature|TeamIdentifier" || true

          if codesign -dv "$APP" 2>&1 | grep -q "Signature=adhoc"; then
            echo "::error::配了证书却签成了 ad-hoc，签名身份没生效"
            exit 1
          fi

          if ! xcrun stapler validate "$APP"; then
            echo "::error::公证票据未附加，对方打开仍会被 Gatekeeper 拦下"
            exit 1
          fi

          # 这条通过才代表对方双击真的能开
          spctl -a -vvv -t exec "$APP"
